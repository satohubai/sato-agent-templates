name: ci

# The same verification as the nightly, on every pull request. No secrets and
# no status commit.

on:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - id: test
        run: npm test

  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      expect: ${{ steps.list.outputs.expect }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Every templates/*/*/sato.template.json becomes a cell: a new template
      # needs no workflow edit.
      - id: list
        run: |
          echo "matrix=$(node scripts/discover-templates.mjs --lanes pinned)" >> "$GITHUB_OUTPUT"
          echo "expect=$(node scripts/discover-templates.mjs --lanes pinned --expect)" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: verify
        uses: ./.github/actions/verify-template
        with:
          template: ${{ matrix.template }}
          framework: ${{ matrix.framework }}
          lane: ${{ matrix.lane }}
          result-file: ${{ runner.temp }}/result-${{ matrix.template }}-${{ matrix.framework }}-${{ matrix.lane }}.json

      - id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-${{ matrix.template }}-${{ matrix.framework }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/result-${{ matrix.template }}-${{ matrix.framework }}-${{ matrix.lane }}.json
          if-no-files-found: warn
          retention-days: 7
