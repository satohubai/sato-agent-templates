name: actions-status

# Sato Status — third-party action checks. Every night, an hour after the
# templates nightly, each action in scripts/actions-catalog.mjs gets one
# read-only conformance call (an anvil fork of Base or Ethereum at its pinned
# block, or a public read — Solana mainnet RPC, a public API, a repo file), a schema lint, Sato Check's custody answers for its source and
# a digest of its description. No secrets: installs come from the npm registry
# with install scripts off, and third-party code runs with PATH and HOME only.
# The status job commits actions-status.json to main.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORK_BLOCK: "51800000"
      ETH_FORK_BLOCK: "23000000"
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - id: foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - id: rpc_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-base-${{ env.FORK_BLOCK }}-eth-${{ env.ETH_FORK_BLOCK }}-actions

      - id: anvil_base
        # A fork that does not start leaves that chain's fork checks as "error"
        # (our side, step no_fork), never "red"; every other check still runs.
        continue-on-error: true
        run: |
          start_anvil() { # <url> <block> <port> <flag>
            anvil --fork-url "$1" --fork-block-number "$2" --port "$3" --silent \
              < /dev/null >> "$RUNNER_TEMP/anvil-$3.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/anvil-$3.pid"
            for _ in $(seq 1 90); do
              if curl -s -A "SatoHub-templates-ci/1.0" -H 'content-type: application/json' \
                   --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
                   "http://127.0.0.1:$3" | grep -q '"result"'; then
                echo "anvil ready on :$3, forked from $1 at block $2"
                echo "RPC_ARGS=${RPC_ARGS:-} $4 http://127.0.0.1:$3" >> "$GITHUB_ENV"
                return 0
              fi
              kill -0 "$(cat "$RUNNER_TEMP/anvil-$3.pid")" 2>/dev/null || return 1
              sleep 1
            done
            kill "$(cat "$RUNNER_TEMP/anvil-$3.pid")" 2>/dev/null || true
            return 1
          }
          start_anvil https://mainnet.base.org "$FORK_BLOCK" 8547 --rpc \
            || start_anvil https://base.drpc.org "$FORK_BLOCK" 8547 --rpc

      - id: anvil_ethereum
        continue-on-error: true
        run: |
          start_anvil() { # <url> <block> <port> <flag>
            anvil --fork-url "$1" --fork-block-number "$2" --port "$3" --silent \
              < /dev/null >> "$RUNNER_TEMP/anvil-$3.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/anvil-$3.pid"
            for _ in $(seq 1 90); do
              if curl -s -A "SatoHub-templates-ci/1.0" -H 'content-type: application/json' \
                   --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
                   "http://127.0.0.1:$3" | grep -q '"result"'; then
                echo "anvil ready on :$3, forked from $1 at block $2"
                echo "RPC_ARGS=${RPC_ARGS:-} $4 http://127.0.0.1:$3" >> "$GITHUB_ENV"
                return 0
              fi
              kill -0 "$(cat "$RUNNER_TEMP/anvil-$3.pid")" 2>/dev/null || return 1
              sleep 1
            done
            kill "$(cat "$RUNNER_TEMP/anvil-$3.pid")" 2>/dev/null || true
            return 1
          }
          start_anvil https://eth.drpc.org "$ETH_FORK_BLOCK" 8548 --rpc-ethereum \
            || start_anvil https://eth-mainnet.public.blastapi.io "$ETH_FORK_BLOCK" 8548 --rpc-ethereum

      - id: check
        timeout-minutes: 40
        run: |
          node scripts/check-actions.mjs \
            --out "$RUNNER_TEMP/action-results" \
            --work "$RUNNER_TEMP/actions-work" \
            $RPC_ARGS

      - id: anvil_stop
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/anvil-*.pid; do [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null || true; done
          pkill -x anvil 2>/dev/null || true

      - id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-results
          path: ${{ runner.temp }}/action-results
          if-no-files-found: warn
          retention-days: 30

  status:
    needs: check
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - id: download
        # A night where the check job died before uploading must still be
        # recorded: every catalogued action becomes error/no_result.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-results
          path: action-results

      - id: update
        run: |
          node scripts/update-actions-status.mjs \
            --results action-results --status actions-status.json \
            --date "$(date -u +%F)" --expect catalog

      - id: commit
        run: |
          git add actions-status.json
          if git diff --cached --quiet; then
            echo "actions status unchanged"
            exit 0
          fi
          git -c user.name="Sato Hub" -c user.email="satohub88@gmail.com" \
            commit -m "actions status: nightly $(date -u +%F)"
          for attempt in 1 2 3; do
            git -c user.name="Sato Hub" -c user.email="satohub88@gmail.com" pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
