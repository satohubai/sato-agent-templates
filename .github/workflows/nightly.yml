name: nightly

# Every template × framework on the pinned lane, every night, with no secrets.
# The status job commits status.json and the badges to the `status` branch
# daily (main is code-only, behind a required check). That commit is by
# design: it also keeps this schedule alive past GitHub's 60-day idle cutoff
# for scheduled workflows.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      inject_drift:
        description: "Drift drill: force <pkg>@<version> in the latest lane (e.g. viem@1.0.0). Empty on a normal run."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      expect: ${{ steps.list.outputs.expect }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Every templates/*/*/sato.template.json becomes a cell: a new template
      # needs no workflow edit.
      - id: list
        run: |
          echo "matrix=$(node scripts/discover-templates.mjs --lanes pinned,latest)" >> "$GITHUB_OUTPUT"
          echo "expect=$(node scripts/discover-templates.mjs --lanes pinned,latest --expect)" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: discover
    # A latest-lane failure is recorded and filed as an issue by the status
    # job; only a pinned failure fails the night.
    continue-on-error: ${{ matrix.lane == 'latest' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: verify
        uses: ./.github/actions/verify-template
        with:
          template: ${{ matrix.template }}
          framework: ${{ matrix.framework }}
          lane: ${{ matrix.lane }}
          inject-drift: ${{ matrix.lane == 'latest' && inputs.inject_drift || '' }}
          result-file: ${{ runner.temp }}/result-${{ matrix.template }}-${{ matrix.framework }}-${{ matrix.lane }}.json

      - id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-${{ matrix.template }}-${{ matrix.framework }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/result-${{ matrix.template }}-${{ matrix.framework }}-${{ matrix.lane }}.json
          if-no-files-found: warn
          retention-days: 30

  status:
    needs: [discover, verify]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that writes: status commit, bump PRs, break issues.
    # actions: write lets it dispatch ci.yml on each bump branch it pushes.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: checkout_status
        # Bot data lives on the `status` branch; main is code-only.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: status
          path: status-data

      - id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - id: download
        # A night where every verify cell died before uploading must still be
        # recorded: update-status.mjs writes a missing cell as error/no_result.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - id: update
        env:
          EXPECT: ${{ needs.discover.outputs.expect }}
        run: |
          node scripts/update-status.mjs \
            --results results --status status-data/status.json --badges status-data/badges \
            --date "$(date -u +%F)" \
            --expect "$EXPECT"

      - id: commit
        working-directory: status-data
        run: |
          git add status.json badges
          if git diff --cached --quiet; then
            echo "status unchanged"
            exit 0
          fi
          git -c user.name="Sato Hub" -c user.email="satohub88@gmail.com" \
            commit -m "status: nightly $(date -u +%F)"
          # nightly and actions-status both write the status branch (different
          # files): a rejected push is rebased and retried, never forced.
          for attempt in 1 2 3 4 5; do
            git -c user.name="Sato Hub" -c user.email="satohub88@gmail.com" pull --rebase origin status && git push origin HEAD:status && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      # Pinned red pages (this step fails, after the status is recorded);
      # bump PRs come from upgrade-policy.json (one per template/framework
      # and class, updated in place) and get ci.yml dispatched on them;
      # latest red + pinned green opens one "upstream break" issue, closed
      # automatically when the latest lane passes again.
      - id: latest_lane
        env:
          GH_TOKEN: ${{ github.token }}
          INJECT_DRIFT: ${{ inputs.inject_drift }}
        run: node scripts/latest-lane.mjs --status status-data/status.json --date "$(date -u +%F)"
